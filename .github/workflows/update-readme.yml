
  name: Build README

  on:
    push:
      branches:
        - main
      paths:
        - "report/**/*.md"
        - "report/*.md"

    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    update-readme:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Generate README
          run: |
            python3 <<'PY'
            from pathlib import Path
            import posixpath
            import re
            
            README = Path("README.md")
            REPORT = Path("report")
            
            START = "<!-- AUTO-DOCS:START -->"
            END = "<!-- AUTO-DOCS:END -->"
            
            documents = []
            
            # =========================
            # FRONT MATTER
            # =========================
            
            front_matter = REPORT / "front-matter"
            
            if front_matter.exists():
                documents.extend(
                    sorted(
                        front_matter.glob("*.md")
                    )
                )
            
            # =========================
            # DOCUMENTACIÓN
            # =========================
            
            documents.extend(
                sorted(
                    REPORT.glob("*.md")
                )
            )

            # =========================
            # RUTAS RELATIVAS PARA README
            # =========================

            def should_rewrite(target):
                target = target.strip()
                if not target or target.startswith("#"):
                    return False

                lowered = target.lower()
                external_prefixes = (
                    "http://",
                    "https://",
                    "mailto:",
                    "tel:",
                    "data:",
                    "javascript:",
                )

                return not (
                    lowered.startswith(external_prefixes)
                    or target.startswith("/")
                )

            def rewrite_target(target, source_file):
                if not should_rewrite(target):
                    return target

                path = target
                suffix = ""

                for separator in ("#", "?"):
                    if separator in path:
                        path, tail = path.split(separator, 1)
                        suffix = separator + tail
                        break

                if not path:
                    return target

                source_dir = source_file.parent.as_posix()
                normalized = posixpath.normpath(
                    posixpath.join(source_dir, path)
                )

                if normalized == ".":
                    normalized = ""

                return normalized + suffix

            def rewrite_content_paths(content, source_file):
                def markdown_link(match):
                    return (
                        match.group(1)
                        + rewrite_target(match.group(2), source_file)
                        + match.group(3)
                    )

                def html_src(match):
                    return (
                        match.group(1)
                        + rewrite_target(match.group(2), source_file)
                        + match.group(3)
                    )

                content = re.sub(
                    r"(!?\[[^\]]*\]\()([^)]+)(\))",
                    markdown_link,
                    content,
                )

                content = re.sub(
                    r"(\bsrc=[\"'])([^\"']+)([\"'])",
                    html_src,
                    content,
                    flags=re.IGNORECASE,
                )

                return content
            
            # =========================
            # GENERAR CONTENIDO
            # =========================
            
            sections = []
            
            for file in documents:
                print(f"Incluyendo: {file}")
            
                content = file.read_text(
                    encoding="utf-8"
                ).strip()
            
                if content:
                    sections.append(
                        rewrite_content_paths(
                            content,
                            file
                        )
                    )
            
            generated_content = "\n\n---\n\n".join(
                sections
            )
            
            # =========================
            # CONTENIDO AUTOMÁTICO
            # =========================
            
            automatic_content = (
                START
                + "\n\n"
                + generated_content
                + "\n\n"
                + END
            )
            
            # =========================
            # LEER README
            # =========================
            
            if README.exists():
                readme_content = README.read_text(
                    encoding="utf-8"
                )
            else:
                readme_content = "# OrganiK\n"
            
            # =========================
            # REEMPLAZAR BLOQUE
            # =========================
            
            if START in readme_content and END in readme_content:
            
                before = readme_content.split(
                    START,
                    1
                )[0]
            
                after = readme_content.split(
                    END,
                    1
                )[1]
            
                readme_content = (
                    before
                    + automatic_content
                    + after
                )
            
            else:
            
                readme_content = (
                    readme_content.rstrip()
                    + "\n\n"
                    + automatic_content
                    + "\n"
                )
            
            # =========================
            # GUARDAR README
            # =========================
            
            README.write_text(
                readme_content,
                encoding="utf-8"
            )
            
            print("")
            print("README generado correctamente.")
            print(
                f"Documentos incluidos: {len(documents)}"
            )
            
            PY

        - name: Commit and push README
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add README.md
            
            if git diff --cached --quiet; then
              echo "README sin cambios."
              exit 0
            fi
            
            git commit -m "docs: rebuild README"
            
            git pull --rebase origin main
            
            git push origin main
